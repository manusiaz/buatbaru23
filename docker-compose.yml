# Database ada di VPS kamu: isi DATABASE_URL di .env, lalu: docker compose up -d --build
services:
  app:
    build: .
    # Nama image tetap: dipakai deploy.sh untuk rollback cepat ke versi sebelumnya (galeri-seleksi:prev)
    image: galeri-seleksi:latest
    restart: unless-stopped
    env_file: .env
    # Hanya bisa diakses dari mesin ini (lewat reverse proxy Nginx/Caddy). Jangan buka port 3000 ke internet.
    ports:
      - "127.0.0.1:${HOST_PORT:-3000}:3000"
    volumes:
      - galeri-data:/data
    # Kalau Postgres jalan langsung di host VPS (bukan container), pakai host.docker.internal di DATABASE_URL
    extra_hosts:
      - "host.docker.internal:host-gateway"
volumes:
  galeri-data:
