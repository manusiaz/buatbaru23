<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#001219">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="/css/base.css">
<title>Masuk · Galeri Seleksi</title>
<style>
.auth { min-height: 100vh; display: grid; grid-template-columns: 1.1fr 1fr; }
.auth .art { background: var(--abyss); color: #fff; padding: 48px; display: flex; flex-direction: column; justify-content: space-between; gap: 32px; }
.auth .art p { color: #C9D3D5; max-width: 460px; }
.auth .tiles { display: flex; gap: 12px; flex-wrap: wrap; }
.auth .tiles i { width: 72px; height: 92px; border-radius: 14px; position: relative; }
.auth .tiles i::before { content: attr(data-n); position: absolute; top: 6px; left: 6px; background: var(--abyss); color: #fff; font: 700 11px var(--f-mono); padding: 2px 5px; border-radius: 5px; }
.auth .form { display: grid; place-items: center; padding: 32px 16px; }
.auth form { width: min(420px, 100%); display: flex; flex-direction: column; gap: 14px; }
.or { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; }
.or::before, .or::after { content: ''; flex: 1; height: 1px; background: var(--line); }
@media (max-width: 860px) { .auth { grid-template-columns: 1fr; } .auth .art { padding: 28px 20px; } .auth .tiles { display: none; } }
</style>
</head>
<body>
<div class="auth">
  <section class="art">
    <div class="row"><div class="logo-mark">001</div><b style="font:800 18px var(--f-display);text-transform:uppercase">Galeri Seleksi</b></div>
    <div>
      <h1 class="display-lg" style="color:#fff">Pelanggan pilih nomor.<br>Editor langsung temukan filenya.</h1>
      <p>Bagikan galeri dari folder Google Drive. Setiap foto bernomor, ada batas waktu, dan daftar pilihan siap ditempel ke Lightroom.</p>
    </div>
    <div class="tiles"><i data-n="004" style="background:#94D2BD"></i><i data-n="007" style="background:#EE9B00"></i><i data-n="010" style="background:#E9D8A6"></i><i data-n="013" style="background:#0A9396"></i><i data-n="016" style="background:#CA6702"></i></div>
  </section>
  <section class="form"><div id="box" style="width:min(420px,100%)"></div></section>
</div>
<script src="/js/ui.js"></script>
<script src="/js/masuk.js"></script>
</body>
</html>
